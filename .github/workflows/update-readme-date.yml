name: Update README Date

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Date in README
        run: |
          # Get current date in DD/MM/YYYY format
          CURRENT_DATE=$(date +'%d/%m/%Y')
          echo "Updating date to $CURRENT_DATE"
          
          # Use sed with -E (Extended Regex) and | delimiter
          # Pattern matches Last%20Updated followed by the date and -blue
          sed -i -E "s|Last%20Updated-[0-9]{2}/[0-9]{2}/[0-9]{4}-blue|Last%20Updated-$CURRENT_DATE-blue|g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add README.md
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to README.md, skipping commit."
          else
            git commit -m "docs: update last updated date to $(date +'%d/%m/%Y')"
            git push origin main
          fi
 