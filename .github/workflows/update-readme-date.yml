name: Update README Date

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Checkout the repository so the workflow can access and modify files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Calculate current date and update the badge in README.md
      - name: Update Date in README
        run: |
          # Get current date in DD/MM/YYYY format
          CURRENT_DATE=$(date +'%d/%m/%Y')
          echo "Updating date to $CURRENT_DATE"
          
          # Use sed with -E (Extended Regex) to find the 'Last Updated' badge and replace the date string
          sed -i -E "s|Last%20Updated-[0-9]{2}/[0-9]{2}/[0-9]{4}-blue|Last%20Updated-$CURRENT_DATE-blue|g" README.md
          # Also update the text version at the bottom
          sed -i -E "s|Last Updated: [0-9]{2}/[0-9]{2}/[0-9]{4}|Last Updated: $CURRENT_DATE|g" README.md

      # Step 3: Commit the change and push it back to the repository
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add README.md
          
          # Check if there are actually changes to commit to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to README.md, skipping commit."
          else
            git commit -m "docs: update last updated date to $(date +'%d/%m/%Y')"
            # Pull with rebase to prevent conflicts if the user pushed in the meantime
            git pull --rebase origin main
            git push origin main
          fi